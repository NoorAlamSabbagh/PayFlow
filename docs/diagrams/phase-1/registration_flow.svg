<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="seqCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6366f1" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#p1Bg)" />

  <!-- Header -->
  <text x="480" y="40" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">Atomic User Registration &amp; Wallet Provisioning Sequence</text>
  <text x="480" y="62" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Phase 1 + Phase 2 Integration • Zero Orphan Users, Zero Orphan Wallets</text>

  <!-- Actors Header -->
  <!-- Actor 1: Client -->
  <rect x="80" y="90" width="120" height="40" rx="8" fill="url(#seqCard)" stroke="#6366f1" stroke-width="1.5" />
  <text x="140" y="115" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle">Client (SPA)</text>
  <line x1="140" y1="130" x2="140" y2="480" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Actor 2: API Gateway -->
  <rect x="290" y="90" width="140" height="40" rx="8" fill="url(#seqCard)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="360" y="115" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Express Gateway</text>
  <line x1="360" y1="130" x2="360" y2="480" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Actor 3: AuthService -->
  <rect x="520" y="90" width="140" height="40" rx="8" fill="url(#seqCard)" stroke="#818cf8" stroke-width="1.5" />
  <text x="590" y="115" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe" text-anchor="middle">AuthService</text>
  <line x1="590" y1="130" x2="590" y2="480" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Actor 4: PostgreSQL Pool -->
  <rect x="750" y="90" width="140" height="40" rx="8" fill="url(#seqCard)" stroke="#10b981" stroke-width="1.5" />
  <text x="820" y="115" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">PostgreSQL 16</text>
  <line x1="820" y1="130" x2="820" y2="480" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Step 1: POST /register -->
  <line x1="140" y1="160" x2="350" y2="160" stroke="#6366f1" stroke-width="2" marker-end="url(#arrIndigo)" />
  <text x="250" y="152" font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">1. POST /api/v1/auth/register</text>

  <!-- Step 2: Validate Zod -->
  <rect x="360" y="175" width="140" height="30" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="430" y="194" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">2. Zod Schema Check</text>

  <!-- Step 3: AuthService.register -->
  <line x1="360" y1="220" x2="580" y2="220" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrIndigo)" />
  <text x="470" y="213" font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">3. register(email, pass, name)</text>

  <!-- Step 4: BEGIN TX -->
  <line x1="590" y1="250" x2="810" y2="250" stroke="#10b981" stroke-width="2" marker-end="url(#arrGreen)" />
  <text x="700" y="243" font-family="JetBrains Mono, monospace" font-size="10" fill="#34d399" text-anchor="middle">4. BEGIN TRANSACTION</text>

  <!-- Step 5: INSERT user -->
  <line x1="590" y1="285" x2="810" y2="285" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrGreen)" />
  <text x="700" y="278" font-family="JetBrains Mono, monospace" font-size="10" fill="#34d399" text-anchor="middle">5. INSERT INTO users (...) RETURNING id</text>

  <!-- Step 6: INSERT wallet -->
  <line x1="590" y1="320" x2="810" y2="320" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrGreen)" />
  <text x="700" y="313" font-family="JetBrains Mono, monospace" font-size="10" fill="#34d399" text-anchor="middle">6. INSERT INTO wallets (user_id, balance=0)</text>

  <!-- Step 7: COMMIT -->
  <line x1="590" y1="355" x2="810" y2="355" stroke="#10b981" stroke-width="2" marker-end="url(#arrGreen)" />
  <text x="700" y="348" font-family="JetBrains Mono, monospace" font-size="10" fill="#34d399" text-anchor="middle">7. COMMIT (On failure: ROLLBACK)</text>

  <!-- Step 8: Token Generation -->
  <rect x="520" y="375" width="140" height="30" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
  <text x="590" y="394" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#a5b4fc" text-anchor="middle">8. JWT + Family Token</text>

  <!-- Step 9: HTTP Response -->
  <line x1="590" y1="425" x2="150" y2="425" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrGreen)" />
  <text x="360" y="418" font-family="JetBrains Mono, monospace" font-size="10" fill="#34d399" text-anchor="middle">9. 201 Created { user, accessToken } + HttpOnly Refresh Cookie</text>

  <!-- Footer Annotation Box -->
  <rect x="80" y="460" width="810" height="28" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="485" y="478" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">
    ACID Invariant: User and Default INR Wallet share the same atomic transaction boundary • Guarantees 1:1 wallet presence
  </text>
</svg>
