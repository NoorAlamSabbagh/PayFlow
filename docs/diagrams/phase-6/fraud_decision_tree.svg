<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="p6Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#140f24" />
    </linearGradient>
    <marker id="mRisk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6366f1" />
    </marker>
    <marker id="mGreen6" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="mRed6" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <rect width="960" height="540" fill="url(#p6Bg)" />

  <text x="480" y="38" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">Phase 6 Rule-Based Fraud &amp; Transaction Risk Engine</text>
  <text x="480" y="60" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Pre-Transaction Risk Scoring Pipeline • Velocity &amp; Volume Rules • State Machine (ALLOW / REVIEW / BLOCK)</text>

  <!-- Flow Tree -->
  <!-- Box 1: Inbound Transaction Evaluation -->
  <rect x="50" y="100" width="220" height="110" rx="10" fill="#111827" stroke="#6366f1" stroke-width="1.5" />
  <rect x="65" y="115" width="190" height="26" rx="4" fill="#6366f1" opacity="0.15" />
  <text x="160" y="132" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#818cf8" text-anchor="middle">INBOUND TRANSACTION</text>
  <text x="65" y="160" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#cbd5e1">• Sender ID, Recipient ID</text>
  <text x="65" y="178" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#cbd5e1">• Amount (paise), Currency</text>
  <text x="65" y="196" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#cbd5e1">• IP, Device Fingerprint</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="270" y1="155" x2="330" y2="155" stroke="#6366f1" stroke-width="2" marker-end="url(#mRisk)" />

  <!-- Box 2: Rule Evaluators -->
  <rect x="340" y="90" width="280" height="375" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" />
  <rect x="355" y="105" width="250" height="28" rx="6" fill="#334155" opacity="0.4" />
  <text x="480" y="124" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" text-anchor="middle">RULE EVALUATION PIPELINE</text>

  <!-- Rule 1: High Volume -->
  <rect x="355" y="145" width="250" height="65" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
  <text x="370" y="167" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700" fill="#fcd34d">Rule 1: Large Transaction Threshold</text>
  <text x="370" y="185" font-family="JetBrains Mono, monospace" font-size="9" fill="#cbd5e1">Amount &gt; ₹50,000 (5,000,000 paise)</text>
  <text x="370" y="201" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8">Risk Weight: +35 points</text>

  <!-- Rule 2: Velocity Check -->
  <rect x="355" y="220" width="250" height="65" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1" />
  <text x="370" y="242" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700" fill="#f87171">Rule 2: Rapid Velocity Spike</text>
  <text x="370" y="260" font-family="JetBrains Mono, monospace" font-size="9" fill="#cbd5e1">&gt; 5 transactions within 60 seconds</text>
  <text x="370" y="276" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8">Risk Weight: +45 points (Possible Bot)</text>

  <!-- Rule 3: New Account Outflow -->
  <rect x="355" y="295" width="250" height="65" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
  <text x="370" y="317" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700" fill="#d8b4fe">Rule 3: Brand New Account Outflow</text>
  <text x="370" y="335" font-family="JetBrains Mono, monospace" font-size="9" fill="#cbd5e1">Account Age &lt; 24h &amp; Outflow &gt; ₹10,000</text>
  <text x="370" y="351" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8">Risk Weight: +30 points</text>

  <!-- Total Score Formula -->
  <rect x="355" y="370" width="250" height="80" rx="6" fill="#0b1120" stroke="#6366f1" stroke-width="1" />
  <text x="480" y="392" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700" fill="#818cf8" text-anchor="middle">Composite Risk Score Calculation</text>
  <text x="480" y="412" font-family="JetBrains Mono, monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Score = Σ(triggered_rule_weights)</text>
  <text x="480" y="432" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Normalized Score: 0 to 100</text>

  <!-- Arrows from Rules to Decisions -->
  <line x1="620" y1="180" x2="680" y2="180" stroke="#10b981" stroke-width="2" marker-end="url(#mGreen6)" />
  <line x1="620" y1="275" x2="680" y2="275" stroke="#f59e0b" stroke-width="2" marker-end="url(#mRisk)" />
  <line x1="620" y1="370" x2="680" y2="370" stroke="#f43f5e" stroke-width="2" marker-end="url(#mRed6)" />

  <!-- Decision Outcomes -->
  <!-- Outcome 1: ALLOW -->
  <rect x="690" y="145" width="220" height="70" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5" />
  <text x="710" y="172" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#10b981">ACTION: ALLOW (Score &lt; 40)</text>
  <text x="710" y="192" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#94a3b8">Proceeds immediately to ACID transaction</text>

  <!-- Outcome 2: MANUAL REVIEW -->
  <rect x="690" y="240" width="220" height="70" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5" />
  <text x="710" y="267" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#f59e0b">ACTION: REVIEW (40 - 75)</text>
  <text x="710" y="287" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#94a3b8">Escrow hold; alerts compliance dashboard</text>

  <!-- Outcome 3: BLOCK -->
  <rect x="690" y="335" width="220" height="70" rx="8" fill="#111827" stroke="#f43f5e" stroke-width="1.5" />
  <text x="710" y="362" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#f43f5e">ACTION: BLOCK (Score &gt; 75)</text>
  <text x="710" y="382" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#fca5a5">Transaction rejected; wallet frozen</text>

  <!-- Bottom Annotation -->
  <rect x="50" y="490" width="860" height="28" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="480" y="508" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">
    Zero Latency Penalty: In-memory risk rule evaluations execute in &lt;5ms before the relational database transaction begins.
  </text>
</svg>
