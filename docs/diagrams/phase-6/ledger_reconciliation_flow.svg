<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="p6bBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#12162a" />
    </linearGradient>
    <marker id="mRecon" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6366f1" />
    </marker>
  </defs>

  <rect width="960" height="540" fill="url(#p6bBg)" />

  <text x="480" y="38" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">Automated Three-Way Financial Reconciliation Engine</text>
  <text x="480" y="60" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">PayFlow Ledger $\leftrightarrow$ Payment Gateway Settlement $\leftrightarrow$ Bank Escrow Account Consistency</text>

  <!-- 3 Input Feeds -->
  <rect x="50" y="95" width="250" height="130" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.5" />
  <rect x="65" y="110" width="220" height="26" rx="4" fill="#10b981" opacity="0.15" />
  <text x="175" y="127" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#6ee7b7" text-anchor="middle">DATA FEED 1: INTERNAL LEDGER</text>
  <text x="65" y="155" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#cbd5e1">• ledger_entries table</text>
  <text x="65" y="173" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#cbd5e1">• transactions (COMPLETED)</text>
  <text x="65" y="191" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#cbd5e1">• Reference IDs, paise amounts</text>
  <text x="65" y="210" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#10b981">Authoritative Internal Records</text>

  <rect x="355" y="95" width="250" height="130" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1.5" />
  <rect x="370" y="110" width="220" height="26" rx="4" fill="#f59e0b" opacity="0.15" />
  <text x="480" y="127" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#fcd34d" text-anchor="middle">DATA FEED 2: GATEWAY BATCH</text>
  <text x="370" y="155" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#cbd5e1">• Daily Settlement File (CSV/API)</text>
  <text x="370" y="173" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#cbd5e1">• Captured transaction batch</text>
  <text x="370" y="191" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#cbd5e1">• Gateway Payment IDs &amp; Fees</text>
  <text x="370" y="210" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#f59e0b">External Processor Records</text>

  <rect x="660" y="95" width="250" height="130" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="675" y="110" width="220" height="26" rx="4" fill="#38bdf8" opacity="0.15" />
  <text x="785" y="127" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">DATA FEED 3: ESCROW POSITION</text>
  <text x="675" y="155" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#cbd5e1">• Bank Nodal Account Balance</text>
  <text x="675" y="173" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#cbd5e1">• Closing Day Settlement Wire</text>
  <text x="675" y="191" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#cbd5e1">• Bank Statement Reconciliation</text>
  <text x="675" y="210" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#38bdf8">Physical Cash Position</text>

  <!-- Reconciliation Processing Engine -->
  <line x1="175" y1="225" x2="350" y2="290" stroke="#10b981" stroke-width="1.5" />
  <line x1="480" y1="225" x2="480" y2="270" stroke="#f59e0b" stroke-width="1.5" />
  <line x1="785" y1="225" x2="610" y2="290" stroke="#38bdf8" stroke-width="1.5" />

  <rect x="230" y="270" width="500" height="85" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
  <text x="480" y="295" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle">NIGHTLY RECONCILIATION MATCHING ENGINE</text>
  <text x="480" y="315" font-family="JetBrains Mono, monospace" font-size="10" fill="#818cf8" text-anchor="middle">Matching Keys: (reference_id, gateway_payment_id, amount_paise)</text>
  <text x="480" y="335" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Computes aggregate variance, identifies discrepancies &amp; auto-settles</text>

  <!-- Reconciliation Status Classification -->
  <rect x="50" y="380" width="195" height="85" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5" />
  <text x="147" y="405" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#10b981" text-anchor="middle">STATUS: MATCHED</text>
  <text x="147" y="425" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Ledger == Gateway == Bank</text>
  <text x="147" y="442" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#34d399" text-anchor="middle">100% Balanced • Auto-Cleared</text>

  <rect x="270" y="380" width="195" height="85" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5" />
  <text x="367" y="405" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#f59e0b" text-anchor="middle">UNMATCHED_GATEWAY</text>
  <text x="367" y="425" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Charged but no ledger entry</text>
  <text x="367" y="442" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#fcd34d" text-anchor="middle">Triggers Orphan Auto-Credit</text>

  <rect x="490" y="380" width="195" height="85" rx="8" fill="#111827" stroke="#f43f5e" stroke-width="1.5" />
  <text x="587" y="405" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#f43f5e" text-anchor="middle">UNMATCHED_INTERNAL</text>
  <text x="587" y="425" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Wallet credited; no cash</text>
  <text x="587" y="442" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#fda4af" text-anchor="middle">URGENT: Flag for Audit</text>

  <rect x="715" y="380" width="195" height="85" rx="8" fill="#111827" stroke="#f43f5e" stroke-width="1.5" />
  <text x="812" y="405" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#f43f5e" text-anchor="middle">AMOUNT_MISMATCH</text>
  <text x="812" y="425" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Currency/Fee Discrepancy</text>
  <text x="812" y="442" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#fda4af" text-anchor="middle">Adjustment Transaction</text>

  <!-- Bottom Annotation -->
  <rect x="50" y="490" width="860" height="28" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="480" y="508" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">
    Accounting Integrity: Automated reconciliation guarantees that virtual balances always tie out to physical currency in the bank.
  </text>
</svg>
