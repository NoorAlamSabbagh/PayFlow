<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="l1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="l2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="l3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="l4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="l5Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="620" fill="url(#bgGrad)" />

  <!-- Grid pattern overlay -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="0" />
      <line x1="0" y1="0" x2="0" y2="40" />
    </pattern>
    <rect width="1000" height="620" fill="url(#grid)" />
  </g>

  <!-- Title & Header -->
  <text x="500" y="45" fill="#f8fafc" font-size="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">PAYFLOW DEFENSE-IN-DEPTH SECURITY MATRIX</text>
  <text x="500" y="70" fill="#94a3b8" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">Multi-Tier Zero-Trust Perimeter, Gateway, Application, &amp; Persistence Protection</text>

  <!-- Outer Layer 1: Edge & Network Security -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="880" height="85" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="0" y="0" width="8" height="85" rx="4" fill="url(#l1Grad)" />
    <text x="30" y="28" fill="#38bdf8" font-size="14" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700">LAYER 1: EDGE &amp; NETWORK PERIMETER</text>
    <text x="30" y="48" fill="#cbd5e1" font-size="12" font-family="'JetBrains Mono', monospace">• AWS CloudFront TLS 1.3 Termination &amp; Strict HSTS (max-age=63072000, includeSubDomains)</text>
    <text x="30" y="66" fill="#cbd5e1" font-size="12" font-family="'JetBrains Mono', monospace">• AWS WAF v2: Managed Rules (OWASP Top 10, IP Reputation, SQLi / XSS Shield, Anti-Scraping)</text>
    <rect x="730" y="20" width="130" height="45" rx="6" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
    <text x="795" y="47" fill="#38bdf8" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">DDoS &amp; Bot Guard</text>
  </g>

  <!-- Layer 2: API Gateway & Traffic Ingress -->
  <g transform="translate(60, 195)">
    <rect x="0" y="0" width="880" height="85" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#818cf8" stroke-width="1.5" />
    <rect x="0" y="0" width="8" height="85" rx="4" fill="url(#l2Grad)" />
    <text x="30" y="28" fill="#818cf8" font-size="14" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700">LAYER 2: API GATEWAY &amp; TRAFFIC POLICING</text>
    <text x="30" y="48" fill="#cbd5e1" font-size="12" font-family="'JetBrains Mono', monospace">• NGINX Ingress Reverse Proxy: Reverse Proxy IP Sanitization (X-Forwarded-For Trust Validation)</text>
    <text x="30" y="66" fill="#cbd5e1" font-size="12" font-family="'JetBrains Mono', monospace">• Redis Sliding Window Rate Limiting (Token Bucket: 10 req/min auth, 100 req/min payments)</text>
    <rect x="730" y="20" width="130" height="45" rx="6" fill="#4338ca" fill-opacity="0.25" stroke="#818cf8" stroke-width="1"/>
    <text x="795" y="47" fill="#818cf8" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">Abuse Mitigation</text>
  </g>

  <!-- Layer 3: Application & Identity (AuthN / AuthZ) -->
  <g transform="translate(60, 295)">
    <rect x="0" y="0" width="880" height="85" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#a855f7" stroke-width="1.5" />
    <rect x="0" y="0" width="8" height="85" rx="4" fill="url(#l3Grad)" />
    <text x="30" y="28" fill="#a855f7" font-size="14" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700">LAYER 3: APPLICATION &amp; ZERO-TRUST IDENTITY</text>
    <text x="30" y="48" fill="#cbd5e1" font-size="12" font-family="'JetBrains Mono', monospace">• Short-Lived Asymmetric JWTs (RS256 / HS256, 15m) + Argon2id Passwords + Family Token Rotation</text>
    <text x="30" y="66" fill="#cbd5e1" font-size="12" font-family="'JetBrains Mono', monospace">• Fine-Grained RBAC &amp; Tenant Ownership Checks: Prevent IDOR via User-Scoped Claims</text>
    <rect x="730" y="20" width="130" height="45" rx="6" fill="#7e22ce" fill-opacity="0.25" stroke="#a855f7" stroke-width="1"/>
    <text x="795" y="47" fill="#a855f7" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">Zero-Trust Identity</text>
  </g>

  <!-- Layer 4: Transaction & Data Integrity -->
  <g transform="translate(60, 395)">
    <rect x="0" y="0" width="880" height="85" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#ec4899" stroke-width="1.5" />
    <rect x="0" y="0" width="8" height="85" rx="4" fill="url(#l4Grad)" />
    <text x="30" y="28" fill="#ec4899" font-size="14" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700">LAYER 4: TRANSACTION EXECUTION &amp; IDEMPOTENCY</text>
    <text x="30" y="48" fill="#cbd5e1" font-size="12" font-family="'JetBrains Mono', monospace">• Dual-Layer Idempotency (Atomic Redis SETNX Lock + Postgres UNIQUE Constraint Key)</text>
    <text x="30" y="66" fill="#cbd5e1" font-size="12" font-family="'JetBrains Mono', monospace">• Deterministic Pessimistic Row Locking (ORDER BY wallet_id ASC FOR UPDATE) Deadlock Shield</text>
    <rect x="730" y="20" width="130" height="45" rx="6" fill="#be185d" fill-opacity="0.25" stroke="#ec4899" stroke-width="1"/>
    <text x="795" y="47" fill="#ec4899" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">Financial Concurrency</text>
  </g>

  <!-- Layer 5: Persistence & Cryptographic Ledger Audit -->
  <g transform="translate(60, 495)">
    <rect x="0" y="0" width="880" height="85" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="8" height="85" rx="4" fill="url(#l5Grad)" />
    <text x="30" y="28" fill="#10b981" font-size="14" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700">LAYER 5: STORAGE ENCRYPTION &amp; IMMUTABLE AUDIT</text>
    <text x="30" y="48" fill="#cbd5e1" font-size="12" font-family="'JetBrains Mono', monospace">• AWS KMS Encrypted EBS/RDS Volumes (AES-256) &amp; Column-level PII Masking/Hashing</text>
    <text x="30" y="66" fill="#cbd5e1" font-size="12" font-family="'JetBrains Mono', monospace">• Double-Entry Ledger Invariance (CHECK balance &gt;= 0, append-only ledger entries, checksum verification)</text>
    <rect x="730" y="20" width="130" height="45" rx="6" fill="#047857" fill-opacity="0.25" stroke="#10b981" stroke-width="1"/>
    <text x="795" y="47" fill="#10b981" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">Immutable Audit</text>
  </g>

  <!-- Footer metadata -->
  <text x="500" y="605" fill="#64748b" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">PayFlow FinTech Architecture • Defense-in-Depth Comprehensive Specification • Phase 8</text>
</svg>
