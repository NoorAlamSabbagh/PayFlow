<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#121129" />
    </linearGradient>
    <linearGradient id="p3Card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <marker id="mP3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6366f1" />
    </marker>
    <marker id="mP3Green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="960" height="560" fill="url(#p3Bg)" />

  <text x="480" y="38" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">Phase 3 P2P Wallet Transfer &amp; Idempotency Architecture</text>
  <text x="480" y="58" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Alice $\rightarrow$ Bob Transfer • L1/L2 Idempotency Barrier • Deterministic Dual-Wallet Locking</text>

  <!-- Actors -->
  <rect x="50" y="85" width="110" height="36" rx="6" fill="url(#p3Card)" stroke="#38bdf8" stroke-width="1.2" />
  <text x="105" y="108" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Alice (Client)</text>
  <line x1="105" y1="121" x2="105" y2="505" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />

  <rect x="220" y="85" width="110" height="36" rx="6" fill="url(#p3Card)" stroke="#f59e0b" stroke-width="1.2" />
  <text x="275" y="108" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#fcd34d" text-anchor="middle">Redis L1 Guard</text>
  <line x1="275" y1="121" x2="275" y2="505" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />

  <rect x="390" y="85" width="120" height="36" rx="6" fill="url(#p3Card)" stroke="#6366f1" stroke-width="1.2" />
  <text x="450" y="108" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">TransferService</text>
  <line x1="450" y1="121" x2="450" y2="505" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />

  <rect x="570" y="85" width="160" height="36" rx="6" fill="url(#p3Card)" stroke="#10b981" stroke-width="1.5" />
  <text x="650" y="108" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#6ee7b7" text-anchor="middle">Postgres (ACID Engine)</text>
  <line x1="650" y1="121" x2="650" y2="505" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />

  <rect x="790" y="85" width="120" height="36" rx="6" fill="url(#p3Card)" stroke="#a855f7" stroke-width="1.2" />
  <text x="850" y="108" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#d8b4fe" text-anchor="middle">Transactional Outbox</text>
  <line x1="850" y1="121" x2="850" y2="505" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Step 1: POST /transfers -->
  <line x1="105" y1="145" x2="440" y2="145" stroke="#6366f1" stroke-width="2" marker-end="url(#mP3)" />
  <text x="270" y="138" font-family="JetBrains Mono, monospace" font-size="9" fill="#cbd5e1" text-anchor="middle">1. POST /transfers (Idempotency-Key: K1, amount: 100000, recipient: Bob)</text>

  <!-- Step 2: Redis SETNX L1 Mutex -->
  <line x1="450" y1="175" x2="285" y2="175" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#mP3)" />
  <text x="365" y="168" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#fcd34d" text-anchor="middle">2. SETNX idempotency:{alice}:{K1} EX 30 (If exists: 409 Conflict)</text>

  <!-- Step 3: BEGIN TX + Check L2 -->
  <line x1="450" y1="205" x2="640" y2="205" stroke="#10b981" stroke-width="2" marker-end="url(#mP3Green)" />
  <text x="545" y="198" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#34d399" text-anchor="middle">3. BEGIN; SELECT response FROM idempotency_keys WHERE key=K1</text>

  <!-- Step 4: Deterministic Lock -->
  <line x1="450" y1="240" x2="640" y2="240" stroke="#10b981" stroke-width="1.5" marker-end="url(#mP3Green)" />
  <text x="545" y="233" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#34d399" text-anchor="middle">4. SELECT * FROM wallets WHERE id IN (Alice, Bob) ORDER BY id ASC FOR UPDATE</text>

  <!-- Step 5: Validate Balance >= 100000 -->
  <rect x="400" y="260" width="100" height="28" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="450" y="278" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">Verify Funds</text>

  <!-- Step 6: Decrement Alice / Increment Bob -->
  <line x1="450" y1="305" x2="640" y2="305" stroke="#10b981" stroke-width="1.5" marker-end="url(#mP3Green)" />
  <text x="545" y="298" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#34d399" text-anchor="middle">5. UPDATE wallets SET balance = balance - 100000 (Alice) / + 100000 (Bob)</text>

  <!-- Step 7: Double-Entry Ledger -->
  <line x1="450" y1="340" x2="640" y2="340" stroke="#10b981" stroke-width="1.5" marker-end="url(#mP3Green)" />
  <text x="545" y="333" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#34d399" text-anchor="middle">6. INSERT ledger_entries: DEBIT Alice (100000), CREDIT Bob (100000)</text>

  <!-- Step 8: Transactional Outbox write -->
  <line x1="450" y1="375" x2="840" y2="375" stroke="#a855f7" stroke-width="1.5" marker-end="url(#mP3Green)" />
  <text x="645" y="368" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#d8b4fe" text-anchor="middle">7. INSERT outbox_events (aggregate_id, 'TRANSFER_COMPLETED', payload)</text>

  <!-- Step 9: Save L2 Response -->
  <line x1="450" y1="410" x2="640" y2="410" stroke="#10b981" stroke-width="1.5" marker-end="url(#mP3Green)" />
  <text x="545" y="403" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#34d399" text-anchor="middle">8. UPDATE idempotency_keys SET status='COMPLETED', response_body={...}</text>

  <!-- Step 10: COMMIT -->
  <line x1="450" y1="440" x2="640" y2="440" stroke="#10b981" stroke-width="2" marker-end="url(#mP3Green)" />
  <text x="545" y="433" font-family="JetBrains Mono, monospace" font-size="9" fill="#34d399" text-anchor="middle">9. COMMIT TRANSACTION</text>

  <!-- Step 11: 200 OK -->
  <line x1="450" y1="475" x2="115" y2="475" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#mP3Green)" />
  <text x="275" y="468" font-family="JetBrains Mono, monospace" font-size="9" fill="#34d399" text-anchor="middle">10. 200 OK { transferId, status: 'COMPLETED', referenceId }</text>

  <!-- Bottom Annotation -->
  <rect x="50" y="515" width="860" height="28" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="480" y="533" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">
    Dual-Write Problem Solved: Financial ledger write &amp; Outbox event insertion share the exact same atomic transaction boundary.
  </text>
</svg>
