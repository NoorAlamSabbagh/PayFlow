<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="p2cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>
    <marker id="mLock" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6366f1" />
    </marker>
    <marker id="mGreenL" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="960" height="540" fill="url(#p2cBg)" />

  <text x="480" y="38" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">Pessimistic Concurrency Control &amp; Deadlock Prevention</text>
  <text x="480" y="60" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">PostgreSQL SELECT ... FOR UPDATE with Deterministic Lock Acquisition (ORDER BY id ASC)</text>

  <!-- Left Side: Race Condition Without Row Locking -->
  <rect x="50" y="90" width="410" height="380" rx="12" fill="#111827" stroke="#f43f5e" stroke-width="1.5" />
  <rect x="65" y="105" width="380" height="28" rx="6" fill="#f43f5e" opacity="0.15" />
  <text x="255" y="124" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#fda4af" text-anchor="middle">NAIVE CONCURRENCY: THE LOST UPDATE ANOMALY</text>

  <rect x="70" y="150" width="160" height="70" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="150" y="172" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Request A (+₹500)</text>
  <text x="150" y="190" font-family="JetBrains Mono, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Reads Balance: 1000</text>
  <text x="150" y="206" font-family="JetBrains Mono, monospace" font-size="9" fill="#cbd5e1" text-anchor="middle">Calculates: 1500</text>

  <rect x="280" y="150" width="160" height="70" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="360" y="172" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#fcd34d" text-anchor="middle">Request B (+₹300)</text>
  <text x="360" y="190" font-family="JetBrains Mono, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Reads Balance: 1000</text>
  <text x="360" y="206" font-family="JetBrains Mono, monospace" font-size="9" fill="#cbd5e1" text-anchor="middle">Calculates: 1300</text>

  <!-- Database state box -->
  <rect x="70" y="250" width="370" height="90" rx="6" fill="#0b1120" stroke="#f43f5e" stroke-width="1" />
  <text x="255" y="272" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">Database Commit Race</text>
  <text x="255" y="294" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#fca5a5" text-anchor="middle">1. Request A writes balance = 1500</text>
  <text x="255" y="312" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#f87171" text-anchor="middle">2. Request B writes balance = 1300 (OVERWRITES A!)</text>
  <text x="255" y="330" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700" fill="#f43f5e" text-anchor="middle">FINAL BALANCE: ₹1,300 (₹500 PERMANENTLY LOST!)</text>

  <rect x="70" y="360" width="370" height="90" rx="6" fill="#1e293b" />
  <text x="85" y="385" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">• No isolation guard on shared scalar</text>
  <text x="85" y="405" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">• Silent financial theft / audit failure</text>
  <text x="85" y="425" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700" fill="#fda4af">• Disastrous for high-frequency wallets</text>

  <!-- Right Side: PayFlow Pessimistic Row Locking -->
  <rect x="500" y="90" width="410" height="380" rx="12" fill="#111827" stroke="#10b981" stroke-width="1.5" />
  <rect x="515" y="105" width="380" height="28" rx="6" fill="#10b981" opacity="0.15" />
  <text x="705" y="124" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#6ee7b7" text-anchor="middle">PAYFLOW: PESSIMISTIC ROW-LEVEL LOCKING</text>

  <!-- Step 1 in lock -->
  <rect x="520" y="150" width="370" height="60" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
  <text x="705" y="172" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">1. Request A: SELECT ... FOR UPDATE</text>
  <text x="705" y="192" font-family="JetBrains Mono, monospace" font-size="9" fill="#34d399" text-anchor="middle">Acquires Exclusive Row Lock on Wallet • Reads Balance: 1000</text>

  <!-- Step 2 in lock -->
  <rect x="520" y="225" width="370" height="60" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
  <text x="705" y="247" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#fcd34d" text-anchor="middle">2. Request B: Blocks in Queue</text>
  <text x="705" y="267" font-family="JetBrains Mono, monospace" font-size="9" fill="#fbbf24" text-anchor="middle">Attempting to lock row $\rightarrow$ Wait Queue (Zero Race Condition)</text>

  <!-- Step 3 in lock -->
  <rect x="520" y="300" width="370" height="60" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
  <text x="705" y="322" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">3. Request A Commits: Balance = 1500</text>
  <text x="705" y="342" font-family="JetBrains Mono, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Ledger inserted • Balance 1500 committed • Row lock released</text>

  <!-- Step 4 in lock -->
  <rect x="520" y="375" width="370" height="75" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1" />
  <text x="705" y="397" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">4. Request B Wakes Up &amp; Evaluates</text>
  <text x="705" y="415" font-family="JetBrains Mono, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Locks row • Reads FRESH balance: 1500 $\rightarrow$ Updates to 1800</text>
  <text x="705" y="435" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#10b981" text-anchor="middle">CORRECT FINAL BALANCE: ₹1,800.00</text>

  <!-- Bottom Annotation -->
  <rect x="50" y="490" width="860" height="28" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="480" y="508" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">
    Deadlock Prevention: ORDER BY id ASC enforces identical lock acquisition order across concurrent requests, eliminating circular wait graphs.
  </text>
</svg>
