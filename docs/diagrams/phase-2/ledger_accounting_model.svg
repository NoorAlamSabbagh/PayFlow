<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="p2dBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0e172a" />
    </linearGradient>
    <linearGradient id="ledgerCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#p2dBg)" />

  <text x="480" y="38" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">Double-Entry Accounting Model &amp; Immutable Ledger</text>
  <text x="480" y="60" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">The Fundamental Invariant: Total Debits == Total Credits • Balance is Derived Truth</text>

  <!-- Left Side: Accounting T-Account -->
  <rect x="50" y="90" width="410" height="380" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" />
  <rect x="65" y="105" width="380" height="28" rx="6" fill="#6366f1" opacity="0.15" />
  <text x="255" y="124" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#a5b4fc" text-anchor="middle">FINANCIAL TRANSACTION T-ACCOUNT (DEPOSIT ₹1,000)</text>

  <!-- Clearing Account (Asset) -->
  <rect x="70" y="150" width="175" height="110" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="157" y="172" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">SYSTEM_GATEWAY_CLEARING</text>
  <text x="157" y="190" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Classification: Asset / Receivable</text>
  <rect x="80" y="205" width="155" height="40" rx="4" fill="#0f172a" />
  <text x="157" y="222" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">DEBIT: +100,000</text>
  <text x="157" y="238" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Asset Inflow (+₹1,000)</text>

  <!-- User Wallet (Liability) -->
  <rect x="265" y="150" width="175" height="110" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
  <text x="352" y="172" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">USER WALLET (Alice)</text>
  <text x="352" y="190" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Classification: Platform Liability</text>
  <rect x="275" y="205" width="155" height="40" rx="4" fill="#0f172a" />
  <text x="352" y="222" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">CREDIT: +100,000</text>
  <text x="352" y="238" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">User Balance (+₹1,000)</text>

  <!-- Invariant Check Banner -->
  <rect x="70" y="280" width="370" height="70" rx="8" fill="#0b1120" stroke="#10b981" stroke-width="1.2" />
  <text x="255" y="306" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#6ee7b7" text-anchor="middle">ACCOUNTING INVARIANT VERIFIED</text>
  <text x="255" y="328" font-family="JetBrains Mono, monospace" font-size="11" fill="#34d399" text-anchor="middle">Total Debits (1000) - Total Credits (1000) = 0</text>
  <text x="255" y="342" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Zero value creation from thin air • Auditor &amp; Regulatory Compliant</text>

  <rect x="70" y="365" width="370" height="90" rx="6" fill="#1e293b" />
  <text x="85" y="390" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700" fill="#cbd5e1">Why Balance Cannot Be Simply Incremented:</text>
  <text x="85" y="410" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8">• A mutable scalar balance has zero provenance (cannot be audited).</text>
  <text x="85" y="426" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8">• The double-entry ledger is the primary source of truth.</text>
  <text x="85" y="442" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8">• Wallet balance is a fast cached aggregate of the ledger history.</text>

  <!-- Right Side: Database Schema & Immutability Trigger -->
  <rect x="500" y="90" width="410" height="380" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" />
  <rect x="515" y="105" width="380" height="28" rx="6" fill="#10b981" opacity="0.15" />
  <text x="705" y="124" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#6ee7b7" text-anchor="middle">IMMUTABLE DATABASE LEDGER TABLE</text>

  <rect x="520" y="145" width="370" height="150" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1" />
  <text x="535" y="170" font-family="JetBrains Mono, monospace" font-size="10" fill="#818cf8">TABLE ledger_entries (</text>
  <text x="550" y="188" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#cbd5e1">id               UUID PRIMARY KEY,</text>
  <text x="550" y="204" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#cbd5e1">transaction_id   UUID REFERENCES transactions,</text>
  <text x="550" y="220" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#cbd5e1">wallet_id        UUID REFERENCES wallets,</text>
  <text x="550" y="236" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#38bdf8">entry_type       ledger_entry_type ('DEBIT','CREDIT'),</text>
  <text x="550" y="252" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#fcd34d">amount           BIGINT NOT NULL (paise &gt; 0),</text>
  <text x="550" y="268" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#34d399">balance_after    BIGINT NOT NULL,</text>
  <text x="550" y="284" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#cbd5e1">created_at       TIMESTAMPTZ DEFAULT NOW()</text>
  <text x="535" y="292" font-family="JetBrains Mono, monospace" font-size="10" fill="#818cf8">);</text>

  <!-- Trigger Box -->
  <rect x="520" y="310" width="370" height="145" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2" />
  <text x="705" y="332" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#fda4af" text-anchor="middle">DATABASE ENGINE IMMUTABILITY TRIGGER</text>
  <text x="535" y="355" font-family="JetBrains Mono, monospace" font-size="9" fill="#fca5a5">CREATE TRIGGER trg_ledger_immutability</text>
  <text x="535" y="372" font-family="JetBrains Mono, monospace" font-size="9" fill="#fca5a5">BEFORE UPDATE OR DELETE ON ledger_entries</text>
  <text x="535" y="389" font-family="JetBrains Mono, monospace" font-size="9" fill="#fca5a5">FOR EACH ROW EXECUTE FUNCTION enforce_ledger_immutability();</text>
  <rect x="535" y="405" width="340" height="35" rx="4" fill="#180b12" />
  <text x="705" y="425" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="700" fill="#f43f5e" text-anchor="middle">RAISE EXCEPTION: UPDATE and DELETE strictly forbidden</text>

  <!-- Bottom Annotation -->
  <rect x="50" y="490" width="860" height="28" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="480" y="508" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">
    Auditing Guarantee: Historical records cannot be rewritten. Accounting corrections must use opposing compensating transactions.
  </text>
</svg>
