<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="c4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <linearGradient id="moduleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="c4Arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6366f1" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#c4Bg)" />

  <!-- Header -->
  <text x="480" y="45" font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.02em">PayFlow Modular Monolith Decomposition (C4 Container View)</text>
  <text x="480" y="70" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Decoupled Domain Packages with Zero-Latency Function Calls • Future Extraction Ready</text>

  <!-- Express Boundary Box -->
  <rect x="50" y="100" width="860" height="380" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="75" y="125" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#818cf8">CONTAINER: PayFlow Core Modular Monolith (Node.js / Express / TypeScript)</text>

  <!-- Module 1: Auth Module -->
  <rect x="80" y="150" width="220" height="130" rx="10" fill="url(#moduleGrad)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="190" y="180" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle">Auth Module</text>
  <text x="190" y="202" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">• auth.service.ts</text>
  <text x="190" y="218" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">• refresh-token.repository.ts</text>
  <text x="190" y="234" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">• Stateless Access / HttpOnly Refresh</text>
  <text x="190" y="255" font-family="JetBrains Mono, monospace" font-size="9" fill="#0284c7" text-anchor="middle">Family Rotation &amp; Replay Guard</text>

  <!-- Module 2: User Module -->
  <rect x="370" y="150" width="220" height="130" rx="10" fill="url(#moduleGrad)" stroke="#6366f1" stroke-width="1.5" />
  <text x="480" y="180" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" fill="#818cf8" text-anchor="middle">User Module</text>
  <text x="480" y="202" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">• user.service.ts</text>
  <text x="480" y="218" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">• user.repository.ts</text>
  <text x="480" y="234" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">• RBAC: USER | ADMIN | OPERATOR</text>
  <text x="480" y="255" font-family="JetBrains Mono, monospace" font-size="9" fill="#6366f1" text-anchor="middle">users table &amp; Role Guards</text>

  <!-- Module 3: Wallet Module -->
  <rect x="660" y="150" width="220" height="130" rx="10" fill="url(#moduleGrad)" stroke="#10b981" stroke-width="1.5" />
  <text x="770" y="180" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle">Wallet Module</text>
  <text x="770" y="202" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">• wallet.service.ts</text>
  <text x="770" y="218" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">• wallet.repository.ts</text>
  <text x="770" y="234" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">• Row-Level Locking (FOR UPDATE)</text>
  <text x="770" y="255" font-family="JetBrains Mono, monospace" font-size="9" fill="#059669" text-anchor="middle">Deterministic ORDER BY id ASC</text>

  <!-- Module 4: Ledger Engine -->
  <rect x="220" y="320" width="230" height="130" rx="10" fill="url(#moduleGrad)" stroke="#f59e0b" stroke-width="1.5" />
  <text x="335" y="350" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" fill="#fcd34d" text-anchor="middle">Ledger Engine</text>
  <text x="335" y="372" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">• ledger.service.ts</text>
  <text x="335" y="388" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">• ledger.repository.ts</text>
  <text x="335" y="404" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">• Double-Entry Balancing Invariant</text>
  <text x="335" y="425" font-family="JetBrains Mono, monospace" font-size="9" fill="#d97706" text-anchor="middle">Immutable Append-Only Audit</text>

  <!-- Module 5: Shared Infrastructure & Pipeline -->
  <rect x="510" y="320" width="230" height="130" rx="10" fill="url(#moduleGrad)" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="625" y="350" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" fill="#e2e8f0" text-anchor="middle">Shared Core</text>
  <text x="625" y="372" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">• pg.Pool Client Management</text>
  <text x="625" y="388" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">• Centralized Error Handler</text>
  <text x="625" y="404" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">• Zod Request Validation</text>
  <text x="625" y="425" font-family="JetBrains Mono, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Winston Structured Logger</text>

  <!-- Intra-process Arrows -->
  <line x1="300" y1="215" x2="360" y2="215" stroke="#6366f1" stroke-width="1.5" marker-end="url(#c4Arrow)" />
  <line x1="590" y1="215" x2="650" y2="215" stroke="#6366f1" stroke-width="1.5" marker-end="url(#c4Arrow)" />
  <line x1="770" y1="280" x2="770" y2="385" stroke="#6366f1" stroke-width="1.5" />
  <line x1="770" y1="385" x2="460" y2="385" stroke="#6366f1" stroke-width="1.5" marker-end="url(#c4Arrow)" />

  <!-- Footer Annotation -->
  <rect x="50" y="495" width="860" height="28" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="480" y="513" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">
    All inter-module communication occurs via atomic in-process TypeScript function calls • Eliminates network latency &amp; 2PC distributed transactions
  </text>
</svg>
