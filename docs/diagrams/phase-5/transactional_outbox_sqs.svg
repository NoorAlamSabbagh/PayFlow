<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="p5Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0d1b2a" />
    </linearGradient>
    <marker id="mOutbox" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="mGreen5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="960" height="540" fill="url(#p5Bg)" />

  <text x="480" y="38" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">Transactional Outbox Pattern with AWS SQS FIFO Queues</text>
  <text x="480" y="60" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Eliminating the Dual-Write Hazard • SKIP LOCKED Relay • Strict Per-Wallet Ordering</text>

  <!-- Dual-Write Problem vs Outbox Comparison -->
  <!-- Container 1: The Dual-Write Hazard -->
  <rect x="50" y="90" width="410" height="380" rx="12" fill="#111827" stroke="#f43f5e" stroke-width="1.5" />
  <rect x="65" y="105" width="380" height="28" rx="6" fill="#f43f5e" opacity="0.15" />
  <text x="255" y="124" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#fda4af" text-anchor="middle">THE DUAL-WRITE HAZARD (WITHOUT OUTBOX)</text>

  <rect x="70" y="150" width="370" height="70" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="85" y="172" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">Step 1: Write to Database</text>
  <text x="85" y="190" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#34d399">COMMIT financial ledger transaction $\rightarrow$ Success</text>

  <rect x="70" y="235" width="370" height="90" rx="6" fill="#180b12" stroke="#f43f5e" stroke-width="1" />
  <text x="85" y="258" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#fda4af">Step 2: Direct Network Call to SQS $\rightarrow$ FAILS!</text>
  <text x="85" y="278" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#fecdd3">• Network timeout, broker unavailable, or process crash</text>
  <text x="85" y="296" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="700" fill="#f43f5e">• CATASTROPHIC: DB committed, but message permanently lost!</text>
  <text x="85" y="312" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#fda4af">• Users never receive notifications or downstream updates</text>

  <rect x="70" y="340" width="370" height="110" rx="6" fill="#1e293b" />
  <text x="85" y="365" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc">Alternative Inverse Hazard:</text>
  <text x="85" y="385" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#94a3b8">• If you publish to SQS first, and then DB transaction fails,</text>
  <text x="85" y="402" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#94a3b8">  you emit a "Phantom Event" for money that was never moved.</text>
  <text x="85" y="420" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="700" fill="#fda4af">• 2PC / Sagas across DB and Message Brokers do not scale.</text>

  <!-- Container 2: PayFlow Transactional Outbox Pattern -->
  <rect x="500" y="90" width="410" height="380" rx="12" fill="#111827" stroke="#a855f7" stroke-width="1.5" />
  <rect x="515" y="105" width="380" height="28" rx="6" fill="#a855f7" opacity="0.15" />
  <text x="705" y="124" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#d8b4fe" text-anchor="middle">PAYFLOW TRANSACTIONAL OUTBOX SOLUTION</text>

  <!-- Step 1 in outbox -->
  <rect x="520" y="145" width="370" height="65" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
  <text x="535" y="167" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">1. Atomic Relational Commit</text>
  <text x="535" y="186" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#34d399">INSERT INTO ledger_entries (...) [Debit + Credit];</text>
  <text x="535" y="200" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#a855f7">INSERT INTO outbox_events (aggregate_id, payload, 'PENDING');</text>

  <!-- Step 2 in outbox -->
  <rect x="520" y="220" width="370" height="65" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
  <text x="535" y="242" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#d8b4fe">2. Asynchronous Outbox Poller</text>
  <text x="535" y="260" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#cbd5e1">SELECT * FROM outbox_events WHERE status='PENDING'</text>
  <text x="535" y="274" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#fcd34d">FOR UPDATE SKIP LOCKED LIMIT 10;</text>

  <!-- Step 3 in outbox -->
  <rect x="520" y="295" width="370" height="65" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
  <text x="535" y="317" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#fcd34d">3. AWS SQS FIFO Delivery</text>
  <text x="535" y="335" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#cbd5e1">SendMessageBatch to payflow-events.fifo</text>
  <text x="535" y="349" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#38bdf8">MessageGroupId = wallet_id (Strict Per-Wallet FIFO)</text>

  <!-- Step 4 in outbox -->
  <rect x="520" y="370" width="370" height="85" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1" />
  <text x="535" y="392" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#34d399">4. Mark Published or Exponential Backoff</text>
  <text x="535" y="412" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#94a3b8">• If SQS succeeds: UPDATE outbox_events status = 'PUBLISHED'</text>
  <text x="535" y="430" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#94a3b8">• If SQS down: Event remains PENDING; retried with zero data loss</text>

  <!-- Bottom Annotation -->
  <rect x="50" y="490" width="860" height="28" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="480" y="508" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">
    At-Least-Once Delivery: Guarantees zero lost financial events even if the message broker experiences a complete outage.
  </text>
</svg>
