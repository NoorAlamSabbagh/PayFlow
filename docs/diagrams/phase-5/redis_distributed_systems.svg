<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="p5bBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#141126" />
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#p5bBg)" />

  <text x="480" y="38" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">Redis In-Memory Architecture in PayFlow</text>
  <text x="480" y="60" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Three Distinct Responsibilities: Distributed Mutexes, Sliding-Window Rate Limiting &amp; Fast Volatile Caching</text>

  <!-- 3 Pillars Grid -->
  <!-- Pillar 1: Distributed Mutexes -->
  <rect x="50" y="95" width="270" height="375" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="1.5" />
  <rect x="65" y="110" width="240" height="28" rx="6" fill="#f59e0b" opacity="0.15" />
  <text x="185" y="129" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#fcd34d" text-anchor="middle">1. DISTRIBUTED MUTEX</text>

  <rect x="65" y="150" width="240" height="60" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
  <text x="185" y="172" font-family="JetBrains Mono, monospace" font-size="9" fill="#fcd34d" text-anchor="middle">SET {idemp:U1}:K1 "LOCK" NX EX 30</text>
  <text x="185" y="192" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Sub-millisecond fast-path acquisition</text>

  <rect x="65" y="220" width="240" height="230" rx="6" fill="#0b1120" />
  <text x="80" y="245" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc">Key Mechanics:</text>
  <text x="80" y="268" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#cbd5e1">• Rejects concurrent double-clicks</text>
  <text x="80" y="286" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#cbd5e1">• Hash Tag: <tspan fill="#38bdf8" font-family="JetBrains Mono, monospace">{idemp:U1}</tspan></text>
  <text x="80" y="304" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#cbd5e1">• Pins to same cluster slot</text>
  <text x="80" y="322" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#cbd5e1">• Auto-expires via TTL on crash</text>
  <text x="80" y="350" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700" fill="#34d399">Why It Matters:</text>
  <text x="80" y="372" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#94a3b8">Shields PostgreSQL from high-volume</text>
  <text x="80" y="388" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#94a3b8">duplicate transfer requests.</text>

  <!-- Pillar 2: Sliding Window Rate Limiting -->
  <rect x="345" y="95" width="270" height="375" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="360" y="110" width="240" height="28" rx="6" fill="#38bdf8" opacity="0.15" />
  <text x="480" y="129" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">2. RATE LIMITING</text>

  <rect x="360" y="150" width="240" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
  <text x="480" y="172" font-family="JetBrains Mono, monospace" font-size="9" fill="#38bdf8" text-anchor="middle">ZADD rate:ip:{ip} timestamp</text>
  <text x="480" y="192" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Sliding-window log algorithm via Lua</text>

  <rect x="360" y="220" width="240" height="230" rx="6" fill="#0b1120" />
  <text x="375" y="245" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc">Policy Matrix:</text>
  <text x="375" y="268" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#cbd5e1">• Public: 100 req / 15 mins</text>
  <text x="375" y="286" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#cbd5e1">• Auth / Login: 5 req / 15 mins</text>
  <text x="375" y="304" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#cbd5e1">• Transfers: 10 req / minute</text>
  <text x="375" y="322" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#cbd5e1">• Deposits: 20 req / hour</text>
  <text x="375" y="350" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700" fill="#34d399">Why It Matters:</text>
  <text x="375" y="372" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#94a3b8">Protects authentication from brute</text>
  <text x="375" y="388" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#94a3b8">force and APIs from DDoS saturation.</text>

  <!-- Pillar 3: Fast Volatile Caching -->
  <rect x="640" y="95" width="270" height="375" rx="12" fill="#111827" stroke="#10b981" stroke-width="1.5" />
  <rect x="655" y="110" width="240" height="28" rx="6" fill="#10b981" opacity="0.15" />
  <text x="775" y="129" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" fill="#6ee7b7" text-anchor="middle">3. VOLATILE METADATA</text>

  <rect x="655" y="150" width="240" height="60" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
  <text x="775" y="172" font-family="JetBrains Mono, monospace" font-size="9" fill="#34d399" text-anchor="middle">SET user:profile:{id} JSON EX 60</text>
  <text x="775" y="192" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Short-lived cached entity records</text>

  <rect x="655" y="220" width="240" height="230" rx="6" fill="#0b1120" />
  <text x="670" y="245" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc">Strict Fintech Boundaries:</text>
  <text x="670" y="268" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#cbd5e1">• Never store authoritative balance in Redis</text>
  <text x="670" y="286" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#cbd5e1">• Never store financial ledger in Redis</text>
  <text x="670" y="304" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#cbd5e1">• Instant eviction on profile mutation</text>
  <text x="670" y="322" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#cbd5e1">• Read-through cache pattern</text>
  <text x="670" y="350" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700" fill="#34d399">Why It Matters:</text>
  <text x="670" y="372" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#94a3b8">PostgreSQL is the source of financial</text>
  <text x="670" y="388" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#94a3b8">truth; Redis is the high-speed shield.</text>

  <!-- Bottom Annotation -->
  <rect x="50" y="490" width="860" height="28" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="480" y="508" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">
    Architectural Discipline: Redis handles volatile state and high-frequency rate checks; it never owns durable financial balances.
  </text>
</svg>
